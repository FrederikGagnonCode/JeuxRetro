<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Wars</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;color:#fff;
    font-family:'Courier New',monospace;display:flex;flex-direction:column;
    align-items:center;justify-content:center;user-select:none;overflow:hidden}
  h1{letter-spacing:6px;margin:0 0 8px;font-size:20px;color:#ffe81f;
     text-shadow:0 0 8px #ffe81f,0 0 18px #b8a000}
  #wrap{position:relative}
  canvas{background:#000;border:2px solid #fff;display:block;cursor:crosshair;
    box-shadow:0 0 24px rgba(80,200,120,.35);touch-action:none}
  #hint{color:#777;font-size:12px;margin-top:10px;text-align:center;line-height:1.6}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:rgba(0,0,0,.82);
    text-align:center;cursor:pointer}
  #overlay h2{font-size:24px;letter-spacing:3px;margin:0 0 12px;color:#ffe81f}
  #overlay p{color:#bbb;font-size:13px;margin:4px 0}
  .blink{animation:blink 1.1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:0}}
  a.back{color:#4ecca3;font-size:12px;margin-top:8px;text-decoration:none;letter-spacing:1px}
  a.back:hover{text-decoration:underline}
</style>
</head>
<body>
  <h1>STAR WARS</h1>
  <div id="wrap">
    <canvas id="game" width="480" height="360"></canvas>
    <div id="overlay">
      <h2 id="ovTitle">STAR WARS</h2>
      <p>Détruisez les TIE fighters et les boules de feu</p>
      <p>Souris : viser · clic / Espace : tirer</p>
      <p>Ne laissez pas les tirs atteindre votre vaisseau (bouclier)</p>
      <p class="blink" style="margin-top:14px">▶ Cliquez ou Espace pour décoller</p>
    </div>
  </div>
  <div id="hint">Souris (ou flèches) : viser · clic / Espace : tirer · P = pause</div>
  <a class="back" href="../index.html">← Menu Arcade</a>

<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W=cv.width, H=cv.height, CX=W/2, CY=H/2;
const FOV=300;
const overlay=document.getElementById('overlay');
const ovTitle=document.getElementById('ovTitle');

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

let stars, ties, fires, lasers, parts, towers, aim;
let score=0, shield=6, wave=1, toSpawn=0, spawnT=0, fireCd=0, flashT=0, msgT=0;
let phase='space', kills=0, turrets=[], turretsDone=0, turretsNeed=8, turSpawnT=0, trenchOff=0, banner='';
let port=null, portT=0, boomT=0;             // bouche d'aération + explosion finale
const KILLN=10, TW=250;                      // victoires avant la tranchee ; demi-largeur tranchee
let running=false, paused=false, over=false;
const keys={};

// ── sons laser ──
let _ac=null;
function actx(){ try{ if(!_ac) _ac=new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume(); }catch(e){} return _ac; }
function laserSfx(freq, dur, vol, type){
  const ac=actx(); if(!ac) return; const t=ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq*0.25,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.03);
}
function sfxEnemyFire(){ laserSfx(440, 0.20, 0.18, 'sawtooth'); }   // tir ennemi (grave)
// ton tir : vrai « PIOU » de blaster — double oscillateur désaccordé qui
// plonge dans l'aigu + claquement de bruit à l'attaque
function sfxPlayerFire(){
  const ac=actx(); if(!ac) return; const t=ac.currentTime, dur=0.16;
  const g=ac.createGain();
  g.gain.setValueAtTime(0.34,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=0.8;
  g.connect(bp); bp.connect(ac.destination);
  [1,1.014].forEach(k=>{                       // léger désaccord = son plus épais
    const o=ac.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(2400*k,t);
    o.frequency.exponentialRampToValueAtTime(320*k,t+dur);
    o.connect(g); o.start(t); o.stop(t+dur+0.03);
  });
  // claquement d'attaque (2 centièmes de bruit)
  const n=Math.floor(ac.sampleRate*0.02), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource(); s.buffer=b;
  const ng=ac.createGain(); ng.gain.value=0.22;
  s.connect(ng); ng.connect(ac.destination); s.start(t);
}

function newGame(){
  stars=[]; for(let i=0;i<120;i++) stars.push(rndStar(Math.random()*900+50));
  ties=[]; fires=[]; lasers=[]; parts=[]; towers=[];
  for(let i=0;i<6;i++) towers.push({side:i%2?1:-1, z:150+i*150});
  aim={x:CX, y:CY};
  score=0; shield=6; wave=1; toSpawn=4; spawnT=40; fireCd=0; flashT=0; msgT=180;
  phase='space'; kills=0; turrets=[]; turretsDone=0; turretsNeed=8; turSpawnT=0; trenchOff=0;
  banner=''; port=null; portT=0; boomT=0;
  over=false; paused=false; running=true;
  hideOverlay();
}
function rndStar(z){ return { x:(Math.random()*2-1)*600, y:(Math.random()*2-1)*450, z }; }

function showOverlay(t,s){ ovTitle.textContent=t; overlay.querySelector('p:nth-of-type(1)').textContent=s; overlay.style.display='flex'; }
function hideOverlay(){ overlay.style.display='none'; }

// ── entrées ──
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(paused && ['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].includes(k)){ paused=false; return; }
  if(k===' '){ if(!running||over){ newGame(); } else fire(); }
  if(k==='p' && running && !over) paused=!paused;
});
document.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
cv.addEventListener('mousemove',e=>{ const r=cv.getBoundingClientRect();
  aim.x=clamp((e.clientX-r.left)*(W/r.width),0,W); aim.y=clamp((e.clientY-r.top)*(H/r.height),0,H); });
cv.addEventListener('mousedown',e=>{ e.preventDefault(); if(!running||over){ newGame(); return; } fire(); });
cv.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.touches[0], r=cv.getBoundingClientRect();
  aim.x=clamp((t.clientX-r.left)*(W/r.width),0,W); aim.y=clamp((t.clientY-r.top)*(H/r.height),0,H);
  if(!running||over){ newGame(); return; } fire(); },{passive:false});
overlay.addEventListener('click',()=>{ if(!running||over) newGame(); });

function fire(){
  if(fireCd>0 || over) return;
  fireCd=9;
  lasers.push({x:aim.x, y:aim.y, t:6});
  sfxPlayerFire();
  // tir au réticule : on touche la cible la plus proche dans le rayon
  let best=null, bestZ=1e9;
  for(const t of ties){ if(!t.alive) continue; const p=projTie(t);
    if(p && Math.hypot(p.x-aim.x,p.y-aim.y)<28+p.k*8 && t.z<bestZ){ best={kind:'tie',o:t}; bestZ=t.z; } }
  for(const f of fires){ const r=fireR(f);
    if(Math.hypot(f.sx-aim.x,f.sy-aim.y)<r+10 && f.z<bestZ){ best={kind:'fire',o:f}; bestZ=f.z; } }
  for(const u of turrets){ if(!u.alive) continue; const p=projTurret(u);
    if(p && Math.hypot(p.x-aim.x,p.y-aim.y)<24+p.sc*7 && u.z<bestZ){ best={kind:'turret',o:u}; bestZ=u.z; } }
  if(phase==='port' && port){ const pp=projPort();
    if(pp && Math.hypot(pp.x-aim.x,pp.y-aim.y)<14+pp.sc*10 && port.z<bestZ){ best={kind:'port'}; bestZ=port.z; } }
  if(best){
    if(best.kind==='tie'){ best.o.alive=false; score+=100; kills++;
      boom(projTie(best.o).x, projTie(best.o).y, '#46d846', 16); }
    else if(best.kind==='turret'){ best.o.alive=false; turretsDone++; score+=200;
      const p=projTurret(best.o); boom(p.x, p.y, '#ff6a6a', 18); }
    else if(best.kind==='port'){ destroyPort(); }
    else { best.o.dead=true; score+=50; boom(best.o.sx, best.o.sy, '#ff8a2a', 12); }
  }
}

function projPort(){ if(!port||port.z<=1) return null; const k=300/port.z;
  return { x:CX, y:CY+150*k, sc:clamp(FOV/port.z,0.25,6) }; }
function destroyPort(){
  score+=10000; phase='boom'; boomT=170; port=null; turrets=[]; fires=[]; ties=[];
  msgT=170; banner='DANS LE MILLE ! L\'ÉTOILE EXPLOSE ! +10000';
  laserSfx(90,1.2,0.2,'sawtooth'); laserSfx(180,1.0,0.14,'square');
  for(let i=0;i<8;i++) boom(CX+(Math.random()*2-1)*150, CY+(Math.random()*2-1)*100, '#ffd23a', 20);
}
function projTurret(u){ if(u.z<=1) return null; const k=300/u.z;
  return { x:CX+u.side*TW*k, y:CY+u.y*k, sc:clamp(FOV/u.z,0.25,6) }; }
function projTie(t){ if(t.z<=1) return null; const k=FOV/t.z; return { x:CX+t.x*k/ (FOV/300), y:CY+t.y*k/(FOV/300), k:FOV/t.z*1 , sc:clamp(FOV/t.z,0.25,6) }; }
function fireR(f){ return clamp(lerp(28,3, f.z/f.z0), 3, 30); }

// ── mise à jour ──
function update(){
  if(!running||paused||over) return;
  if(fireCd>0) fireCd--; if(flashT>0) flashT--; if(msgT>0) msgT--;

  // viser au clavier
  const ks=4;
  if(keys['arrowleft']) aim.x-=ks; if(keys['arrowright']) aim.x+=ks;
  if(keys['arrowup']) aim.y-=ks; if(keys['arrowdown']) aim.y+=ks;
  aim.x=clamp(aim.x,0,W); aim.y=clamp(aim.y,0,H);

  // étoiles
  stars.forEach(s=>{ s.z-=8; if(s.z<10){ const n=rndStar(900); s.x=n.x; s.y=n.y; s.z=n.z; } });
  // tours (surface étoile noire) qui défilent — seulement en espace ouvert
  if(phase==='space') towers.forEach(t=>{ t.z-=6; if(t.z<10){ t.z=900; t.side=Math.random()<.5?-1:1; } });

  // assez de victoires : plongée dans la TRANCHÉE
  if(phase==='space' && kills>=KILLN){
    phase='trench'; kills=0; turrets=[]; turretsDone=0; turretsNeed=8+wave;
    turSpawnT=30; ties=[]; fires=[]; msgT=200; banner='LA TRANCHÉE ! DÉTRUIS LES '+turretsNeed+' CANONS';
    laserSfx(200,0.6,0.12,'sawtooth');
  }
  if(phase==='trench'||phase==='port'){
    trenchOff=(trenchOff+7+wave*0.4)%84;
    // canons sur les parois
    turSpawnT--;
    if(turSpawnT<=0 && turrets.filter(u=>u.alive).length<(phase==='trench'?4:2)){
      turrets.push({ side:Math.random()<.5?-1:1, y:-60+Math.random()*170, z:900,
        alive:true, shootCd:60+Math.random()*50 });
      turSpawnT=50+Math.random()*40;
    }
    turrets.forEach(u=>{
      if(!u.alive) return;
      u.z-=6+wave*0.4;
      u.shootCd--;
      if(u.shootCd<=0 && u.z>150 && u.z<800){
        const p=projTurret(u);
        if(p){ fires.push({ sx:p.x, sy:p.y, z:u.z, z0:u.z, dead:false }); sfxEnemyFire(); }
        u.shootCd=80+Math.random()*60-wave*3;
      }
    });
    turrets=turrets.filter(u=>u.alive && u.z>40);
    // tranchée nettoyée : place au COUP DE GRÂCE
    if(phase==='trench' && turretsDone>=turretsNeed){
      phase='port'; score+=2000; port=null; portT=90;
      msgT=220; banner='LA BOUCHE D\'AÉRATION ! TIR PRÉCIS !';
      laserSfx(700,0.5,0.1,'triangle');
    }
  }
  // l'évent d'aération approche sur le plancher : un seul tir bien placé
  if(phase==='port'){
    if(!port){ portT--; if(portT<=0) port={z:900}; }
    else{
      port.z-=6+wave*0.4;
      if(port.z<52){ port=null; portT=110; msgT=150; banner='RATÉ ! UN AUTRE ÉVENT APPROCHE…'; }
    }
  }
  // l'Étoile de la Mort explose
  if(phase==='boom'){
    boomT--;
    if(boomT%6===0) boom(CX+(Math.random()*2-1)*190, CY+(Math.random()*2-1)*130,
      ['#ffd23a','#ff8a2a','#fff'][Math.floor(Math.random()*3)], 14);
    if(boomT<=0){
      phase='space'; wave++; kills=0; toSpawn=3+wave; ties=[]; fires=[]; turrets=[];
      msgT=220; banner='UNE NOUVELLE ÉTOILE DE LA MORT APPROCHE…';
    }
  }

  // apparition des TIE
  if(toSpawn>0){ spawnT--; if(spawnT<=0 && ties.filter(t=>t.alive).length<5){
    ties.push({ x:(Math.random()*2-1)*(phase==='trench'?170:420),
      y:(phase==='trench'? -40+Math.random()*150 : (Math.random()*2-1)*200), z:900,
      sway:Math.random()*Math.PI*2, alive:true, shootCd:50+Math.random()*60 });
    toSpawn--; spawnT=35+Math.random()*30;
  }}

  // TIE : avancent vers le joueur, tirent
  ties.forEach(t=>{
    if(!t.alive) return;
    t.z -= 3.2 + wave*0.25;
    t.sway += 0.04; t.x += Math.sin(t.sway)*1.2;
    t.shootCd--;
    if(t.shootCd<=0 && t.z>150 && t.z<800){ spawnFire(t); t.shootCd=70+Math.random()*70 - wave*4; }
    if(t.z<=45){ t.alive=false; damage(); boom(CX,CY,'#46d846',10); }   // collision
  });
  ties = ties.filter(t=>t.alive);   // les TIE détruits/passés sont retirés

  // boules de feu : grossissent en place puis touchent
  fires.forEach(f=>{ f.z -= 4.5 + wave*0.3; if(f.z<=20 && !f.dead){ f.dead=true; damage(); } });
  fires = fires.filter(f=>!f.dead);

  lasers.forEach(l=>l.t--); lasers=lasers.filter(l=>l.t>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;}); parts=parts.filter(p=>p.life>0);

  // vague suivante
  if(toSpawn<=0 && ties.length===0){ wave++; toSpawn=3+wave; spawnT=30; msgT=150; }
}

function spawnFire(t){
  const p=projTie(t); if(!p) return;
  fires.push({ sx:p.x, sy:p.y, z:t.z, z0:t.z, dead:false });
  sfxEnemyFire();
}
function damage(){
  if(over) return;
  shield--; flashT=10;
  if(shield<=0){ shield=0; over=true; running=false; ArcadeFX.die(cv, CX, CY, 'explosion', ()=>{ showOverlay('VAISSEAU DÉTRUIT','Score : '+score); }); }
}
function boom(x,y,color,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=Math.random()*4+1;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:18+Math.random()*12,color}); } }

// ── rendu ──
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.lineCap='round';

  // étoiles
  stars.forEach(s=>{ const k=FOV/s.z; const x=CX+s.x*k/ (FOV/300), y=CY+s.y*k/(FOV/300);
    if(x>=0&&x<W&&y>=0&&y<H){ const b=clamp(1-s.z/900,0.1,1); ctx.fillStyle='rgba(255,255,255,'+b+')'; ctx.fillRect(x,y,b>0.6?2:1,b>0.6?2:1); } });

  if(phase==='space') drawDeathStar();
  else drawTrench();
  if(phase==='port' && port) drawPort();

  ctx.save(); ctx.shadowBlur=6;
  // tours de la surface (rouge/bleu) sur les côtés
  if(phase==='space') towers.forEach(t=>drawTower(t));
  turrets.forEach(u=>{ if(u.alive) drawTurret(u); });
  // TIE fighters
  ties.forEach(t=>{ if(t.alive){ const p=projTie(t); if(p) drawTie(p.x,p.y,p.sc); } });
  // boules de feu
  fires.forEach(f=>drawFire(f));
  ctx.restore();

  // les 4 canons de l'aile en X, visibles aux coins comme sur la borne
  drawCannons();
  // lasers du joueur : faisceaux convergents depuis les 4 canons
  lasers.forEach(l=>{
    const a=l.t/6;
    ctx.strokeStyle='rgba(90,210,255,'+a+')'; ctx.lineWidth=2; ctx.shadowColor='#5ad1ff'; ctx.shadowBlur=8;
    cannonTips().forEach(c=>{ ctx.beginPath(); ctx.moveTo(c[0],c[1]); ctx.lineTo(l.x,l.y); ctx.stroke(); });
    ctx.shadowBlur=0;
  });

  // particules
  parts.forEach(p=>{ ctx.globalAlpha=Math.min(1,p.life/18); ctx.fillStyle=p.color; ctx.fillRect(p.x-1,p.y-1,3,3); });
  ctx.globalAlpha=1;

  // réticule
  drawReticle(aim.x, aim.y);

  // explosion finale de l'Étoile de la Mort
  if(phase==='boom'){
    const t=1-boomT/170;
    if(boomT>150){ ctx.fillStyle='rgba(255,255,255,'+((boomT-150)/20*0.9)+')'; ctx.fillRect(0,0,W,H); }
    ctx.strokeStyle='rgba(255,180,60,'+Math.max(0,1-t)+')'; ctx.lineWidth=3;
    ctx.shadowColor='#ff8a2a'; ctx.shadowBlur=14;
    for(let i=0;i<3;i++){ const r=t*540-i*95;
      if(r>0){ ctx.beginPath(); ctx.arc(CX,CY,r,0,Math.PI*2); ctx.stroke(); } }
    ctx.shadowBlur=0;
  }

  // flash de dégât
  if(flashT>0){ ctx.fillStyle='rgba(255,40,40,'+(flashT/10*0.35)+')'; ctx.fillRect(0,0,W,H); }

  drawHUD();

  if(paused){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe81f'; ctx.textAlign='center'; ctx.font='30px "Courier New",monospace'; ctx.fillText('PAUSE',CX,CY); }
}

/* — l'Étoile de la Mort, au loin dans l'espace — */
function drawDeathStar(){
  const x=W-118, y=104, r=66;
  ctx.save();
  ctx.fillStyle='#14141e'; ctx.strokeStyle='#8a8aa8'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // tranchée équatoriale
  ctx.beginPath(); ctx.moveTo(x-r,y+6); ctx.quadraticCurveTo(x,y+14,x+r,y+6); ctx.stroke();
  ctx.globalAlpha=.5;
  ctx.beginPath(); ctx.moveTo(x-r+2,y+11); ctx.quadraticCurveTo(x,y+19,x+r-2,y+11); ctx.stroke();
  ctx.globalAlpha=1;
  // parabole du superlaser
  ctx.beginPath(); ctx.arc(x-r*0.38,y-r*0.38,r*0.3,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x-r*0.38,y-r*0.38,r*0.12,0,Math.PI*2); ctx.stroke();
  // détails de surface
  ctx.globalAlpha=.35;
  const dets=[[18,-30,9],[34,10,6],[-6,28,7],[30,-46,5],[-28,44,5]];
  dets.forEach(function(d){ ctx.strokeRect(x+d[0],y+d[1],d[2],d[2]*0.7); });
  ctx.globalAlpha=1; ctx.restore();
}
/* — la tranchée : parois convergentes + traverses qui défilent — */
function drawTrench(){
  const vp={x:CX,y:CY+12};
  const P=(wx,wy,z)=>{ const k=300/z; return [CX+wx*k, CY+wy*k]; };
  ctx.strokeStyle='#8a8aa8'; ctx.lineWidth=1.2;
  [[-TW,-150],[TW,-150],[-TW,150],[TW,150]].forEach(function(e){
    const a=P(e[0],e[1],64);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(vp.x,vp.y); ctx.stroke();
  });
  ctx.globalAlpha=.55;
  for(let i=0;i<10;i++){
    const z=64+((i*84+(84-trenchOff))%840);
    const tl=P(-TW,-150,z), bl=P(-TW,150,z), tr=P(TW,-150,z), br=P(TW,150,z);
    ctx.beginPath(); ctx.moveTo(tl[0],tl[1]); ctx.lineTo(bl[0],bl[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tr[0],tr[1]); ctx.lineTo(br[0],br[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bl[0],bl[1]); ctx.lineTo(br[0],br[1]); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
/* — la bouche d'aération, sur le plancher de la tranchée — */
function drawPort(){
  const pp=projPort(); if(!pp) return;
  const k=300/port.z, w=100*k, h=26*k;
  ctx.strokeStyle='#7be06a'; ctx.lineWidth=Math.max(1,1.5*Math.min(pp.sc,2));
  ctx.shadowColor='#7be06a'; ctx.shadowBlur=8;
  ctx.strokeRect(pp.x-w/2, pp.y-h/2, w, h);
  ctx.globalAlpha=.7;
  for(let i=1;i<4;i++){ const xx=pp.x-w/2+w*i/4;
    ctx.beginPath(); ctx.moveTo(xx,pp.y-h/2); ctx.lineTo(xx,pp.y+h/2); ctx.stroke(); }
  ctx.globalAlpha=1;
  // anneau de visée pulsant
  const pr=(performance.now()%600)/600;
  ctx.globalAlpha=1-pr;
  ctx.beginPath(); ctx.arc(pp.x,pp.y,(10+pr*26)*Math.min(pp.sc,3),0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}
/* — canon de la tranchée, accroché à une paroi — */
function drawTurret(u){
  const p=projTurret(u); if(!p) return;
  const sc=clamp(p.sc,0.25,4), w=14*sc, h=16*sc;
  ctx.strokeStyle='#ff6a6a'; ctx.lineWidth=Math.max(1,1.3*Math.min(sc,2));
  ctx.shadowColor='#ff5252'; ctx.shadowBlur=6;
  ctx.strokeRect(p.x-w/2, p.y-h/4, w, h/2);
  ctx.beginPath(); ctx.arc(p.x, p.y-h/4, w/2.4, Math.PI, 0); ctx.stroke();
  const ang=Math.atan2(CY-p.y, CX-p.x);
  ctx.beginPath(); ctx.moveTo(p.x, p.y-h/4);
  ctx.lineTo(p.x+Math.cos(ang)*w*0.9, p.y-h/4+Math.sin(ang)*w*0.9); ctx.stroke();
  ctx.shadowBlur=0;
}

/* — les 4 canons du chasseur : bouts visibles aux coins de l'écran.
   Légère parallaxe opposée au réticule = sensation de cockpit. — */
function cannonTips(){
  const px=(aim.x-CX)*-0.035, py=(aim.y-CY)*-0.035;
  return [[16+px,H-10+py],[W-16+px,H-10+py],[24+px,44+py],[W-24+px,44+py]];
}
function drawCannons(){
  const tips=cannonTips();
  const corners=[[-26,H+26],[W+26,H+26],[-26,-26],[W+26,-26]];
  const firing=lasers.length>0;
  ctx.strokeStyle='#cfd8ff'; ctx.lineWidth=1.6;
  tips.forEach((tp,i)=>{
    const c=corners[i];
    const dx=tp[0]-c[0], dy=tp[1]-c[1], L=Math.hypot(dx,dy);
    const nx=-dy/L, ny=dx/L;                     // normale au fût
    const bw=8, tw=3;                            // largeur base → bout (fuselé)
    ctx.beginPath();
    ctx.moveTo(c[0]+nx*bw, c[1]+ny*bw); ctx.lineTo(tp[0]+nx*tw, tp[1]+ny*tw);
    ctx.moveTo(c[0]-nx*bw, c[1]-ny*bw); ctx.lineTo(tp[0]-nx*tw, tp[1]-ny*tw);
    ctx.stroke();
    // bouche du canon + bague
    ctx.beginPath(); ctx.arc(tp[0],tp[1],tw+1.2,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tp[0]+nx*(tw+3)-dx/L*7, tp[1]+ny*(tw+3)-dy/L*7);
    ctx.lineTo(tp[0]-nx*(tw+3)-dx/L*7, tp[1]-ny*(tw+3)-dy/L*7);
    ctx.stroke();
    // lueur de tir à la bouche
    if(firing){
      ctx.fillStyle='rgba(90,210,255,'+(lasers[0].t/6*0.85)+')';
      ctx.shadowColor='#5ad1ff'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(tp[0],tp[1],5,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
  });
}
function drawTie(x,y,sc){
  const wing=18*sc, ball=6*sc, gap=14*sc;
  ctx.strokeStyle='#46d846'; ctx.lineWidth=Math.max(1,1.4*Math.min(sc,2));
  // pylônes
  ctx.beginPath(); ctx.moveTo(x-gap,y); ctx.lineTo(x-ball,y); ctx.moveTo(x+ball,y); ctx.lineTo(x+gap,y); ctx.stroke();
  // ailes hexagonales
  for(const s of [-1,1]){
    const wx=x+s*gap;
    ctx.beginPath();
    ctx.moveTo(wx, y-wing); ctx.lineTo(wx+s*wing*0.5, y-wing*0.6);
    ctx.lineTo(wx+s*wing*0.5, y+wing*0.6); ctx.lineTo(wx, y+wing);
    ctx.lineTo(wx-s*wing*0.5, y+wing*0.6); ctx.lineTo(wx-s*wing*0.5, y-wing*0.6);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx,y-wing); ctx.lineTo(wx,y+wing); ctx.stroke();
  }
  // boule centrale
  ctx.beginPath(); ctx.arc(x,y,ball,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,ball*0.5,0,Math.PI*2); ctx.stroke();
}
function drawFire(f){
  const r=fireR(f);
  ctx.strokeStyle='#ff8a2a'; ctx.fillStyle='rgba(255,90,0,.5)'; ctx.lineWidth=2; ctx.shadowColor='#ff6a00'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(f.sx,f.sy,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#ffd23a';
  for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; ctx.beginPath(); ctx.moveTo(f.sx,f.sy); ctx.lineTo(f.sx+Math.cos(a)*r,f.sy+Math.sin(a)*r); ctx.stroke(); }
  ctx.shadowBlur=0;
}
function drawTower(t){
  const k=FOV/t.z, sc=clamp(k/(FOV/300),0.2,5);
  const x=CX + t.side*(220)*k/(FOV/300);
  const y=CY + 120*k/(FOV/300);
  if(x<-60||x>W+60) return;
  const w=22*sc, h=44*sc;
  ctx.strokeStyle='#d23b3b'; ctx.lineWidth=Math.max(1,1.2*Math.min(sc,2));
  ctx.strokeRect(x-w/2, y-h/2, w, h);
  ctx.strokeStyle='#2b6dff';
  ctx.beginPath(); ctx.moveTo(x-w/2,y); ctx.lineTo(x+w/2,y);
  ctx.moveTo(x,y-h/2); ctx.lineTo(x,y+h/2); ctx.stroke();
}
function drawReticle(x,y){
  ctx.strokeStyle='#5ad1ff'; ctx.lineWidth=1.5; ctx.shadowColor='#5ad1ff'; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-16,y); ctx.lineTo(x-6,y); ctx.moveTo(x+6,y); ctx.lineTo(x+16,y);
  ctx.moveTo(x,y-16); ctx.lineTo(x,y-6); ctx.moveTo(x,y+6); ctx.lineTo(x,y+16);
  ctx.stroke(); ctx.shadowBlur=0;
}

function drawHUD(){
  ctx.textAlign='left'; ctx.font='bold 15px "Courier New",monospace';
  ctx.fillStyle='#d23b3b'; ctx.fillText('SCORE', 12, 20);
  ctx.fillStyle='#ff5a5a'; ctx.fillText(String(score).padStart(5,'0'), 12, 36);
  ctx.textAlign='right';
  ctx.fillStyle='#d23b3b'; ctx.fillText(wave+' WAVE', W-12, 20);
  // jauge de bouclier (vert) au centre haut
  ctx.strokeStyle='#46d846'; ctx.lineWidth=1.5; ctx.shadowColor='#46d846'; ctx.shadowBlur=4;
  ctx.beginPath(); ctx.moveTo(CX-70,30); ctx.lineTo(CX,10); ctx.lineTo(CX+70,30); ctx.stroke();
  for(let i=0;i<6;i++){ const t=i/6; const xx=lerp(CX-66,CX-2,t), yy=lerp(28,12,t);
    ctx.globalAlpha = i<shield?1:0.2; ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx,yy+8); ctx.stroke();
    const x2=CX+66-(xx-(CX-66)); ctx.beginPath(); ctx.moveTo(x2,yy); ctx.lineTo(x2,yy+8); ctx.stroke(); }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  ctx.fillStyle='#46d846'; ctx.textAlign='center'; ctx.font='bold 13px "Courier New",monospace';
  ctx.fillText('SHIELD', CX, 44);
  // progression de phase (sous WAVE)
  ctx.textAlign='right'; ctx.font='bold 12px "Courier New",monospace';
  if(phase==='space'){ ctx.fillStyle='#46d846'; ctx.fillText('CIBLES '+kills+'/'+KILLN, W-12, 36); }
  else if(phase==='trench'){ ctx.fillStyle='#ff6a6a'; ctx.fillText('CANONS '+turretsDone+'/'+turretsNeed, W-12, 36); }
  else if(phase==='port'){ ctx.fillStyle='#7be06a';
    if(Math.floor(performance.now()/300)%2) ctx.fillText("VISE L'ÉVENT !", W-12, 36); }
  // message
  if(msgT>0){ ctx.fillStyle='#d23b3b'; ctx.font='bold 16px "Courier New",monospace'; ctx.textAlign='center';
    ctx.fillText(banner||'SHOOT TIE FIGHTERS', CX, 64); }
}

function loop(){ update(); draw(); if(window.ArcadeHi)ArcadeHi.submit(score); requestAnimationFrame(loop); }
aim={x:CX,y:CY}; stars=[]; for(let i=0;i<120;i++) stars.push(rndStar(Math.random()*900+50));
ties=[]; fires=[]; lasers=[]; parts=[]; towers=[];
loop();
</script>
